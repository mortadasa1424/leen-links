<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>روابط لين</title>
<meta name="description" content="منصة لين: دورات مباشرة ومصادر مجانية لاختبارات القدرات والتحصيلي وموهبة والتدرج والابتعاث.">
<meta property="og:title" content="لين .. مستقبلك يستاهل">
<meta property="og:description" content="دورات مباشرة ومصادر مجانية لاختبارات القدرات والتحصيلي وموهبة والتدرج والابتعاث.">
<meta name="theme-color" content="#301C7A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  /* Leen brand palette */
  --white: #FFFFFF;
  --indigo: #301C7A;
  --cyan: #00C3E0;
  --coral: #FC5E6C;
  --green: #87D68D;
  --yellow: #FFE066;
  --olive: #DACC3A;
  --orange: #FF8B13;
  --ink: #301C7A;
  --muted: #6A628F;
  --accent: var(--cyan);
  --font: "Tajawal", "Segoe UI", Tahoma, Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: var(--font);
  color: var(--ink);
  font-size: 17px;
  line-height: 1.6;
  background: var(--white);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; }
:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; border-radius: 8px; }

/* ===== Hero: calm indigo band, logo in the corner, soft glow ===== */
.hero {
  position: relative;
  overflow: hidden;
  background: var(--indigo);
  color: #fff;
  padding: 16px 18px 72px;
  isolation: isolate;
}
.blob { position: absolute; border-radius: 50%; filter: blur(56px); opacity: .38; z-index: -1; animation: drift 16s ease-in-out infinite alternate; }
.blob.b1 { width: 240px; height: 240px; background: var(--cyan); top: -90px; inset-inline-start: -70px; }
.blob.b2 { width: 210px; height: 210px; background: var(--coral); bottom: -60px; inset-inline-end: -80px; opacity: .3; animation-duration: 19s; animation-delay: -5s; }
@keyframes drift {
  0% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(24px, 18px) scale(1.1); }
  100% { transform: translate(-18px, 8px) scale(.96); }
}
@keyframes flow { to { background-position: 300% 0; } }
.wave { position: absolute; bottom: -1px; left: 0; width: 100%; height: 48px; display: block; }

.topbar { max-width: 480px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
.logo { height: 30px; width: auto; display: block; }
.lang {
  font: 700 13px/1 var(--font);
  color: #fff;
  background: transparent;
  border: 1px solid rgba(255,255,255,.3);
  border-radius: 999px;
  padding: 8px 14px 7px;
  cursor: pointer;
  transition: background .2s ease, color .2s ease;
}
.lang:hover { background: #fff; color: var(--indigo); }

.hero-in { max-width: 480px; margin: 0 auto; padding-top: 34px; }
.hero h1 { margin: 0; font-size: 30px; line-height: 1.4; font-weight: 800; }
.hero h1 .glow { color: var(--cyan); }
.accred {
  display: flex; align-items: center; gap: 7px;
  margin: 8px 0 0;
  font-size: 14px; font-weight: 500; color: #CFC8F0;
}
.accred svg { width: 17px; height: 17px; flex: none; color: var(--cyan); }

/* One capsule: enroll is the main action, WhatsApp rides along inside it */
.cta {
  display: flex; align-items: center; gap: 4px;
  margin-top: 24px;
  padding: 5px;
  border-radius: 999px;
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.16);
}
.cta-main {
  flex: 1; min-width: 0;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 50px;
  padding: 0 14px;
  border-radius: 999px;
  background: var(--cyan); color: var(--indigo);
  font-size: 16px; font-weight: 800;
  white-space: nowrap;
  transition: background .2s ease, transform .2s ease;
}
.cta-main:hover { background: #33D0E8; }
.cta-main:active, .cta-alt:active { transform: scale(.97); }
.cta-main svg { width: 18px; height: 18px; flex: none; transition: transform .2s ease; }
[dir="rtl"] .cta-main svg { transform: scaleX(-1); }
.cta-main:hover svg { transform: translateX(3px); }
[dir="rtl"] .cta-main:hover svg { transform: scaleX(-1) translateX(3px); }
.cta-alt {
  display: flex; align-items: center; gap: 8px;
  min-height: 50px;
  padding-inline: 6px 14px;
  border-radius: 999px;
  color: #fff;
  font-size: 15px; font-weight: 700;
  white-space: nowrap;
  transition: background .2s ease;
}
.cta-alt:hover { background: rgba(255,255,255,.1); }
.wa { width: 38px; height: 38px; flex: none; display: grid; place-items: center; border-radius: 50%; background: #fff; color: var(--indigo); }
.wa svg { width: 19px; height: 19px; }

/* ===== Body: one column on phones, two on tablets and laptops ===== */
.page { max-width: 480px; margin: 0 auto; padding: 0 16px 28px; display: flex; flex-direction: column; gap: 30px; }
.col { display: flex; flex-direction: column; gap: 30px; min-width: 0; }



/* Live GAT: the one featured element, sits over the wave */
.live {
  position: relative;
  overflow: hidden;
  margin-top: -44px;
  display: flex; align-items: center; gap: 14px;
  padding: 20px 20px 18px;
  border-radius: 28px;
  color: var(--indigo);
  background: linear-gradient(110deg, var(--coral), #FF8A94, var(--coral), #E94A5A, var(--coral));
  background-size: 300% 100%;
  animation: flow 9s linear infinite;
  box-shadow: 0 18px 36px -16px rgba(252,94,108,.75);
  transition: transform .2s ease;
}
.live:hover { transform: translateY(-3px) rotate(-.4deg); }
.live::after {
  /* light sweep */
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.45) 50%, transparent 70%);
  transform: translateX(-120%);
  animation: sweep 4.5s ease-in-out infinite;
  pointer-events: none;
}
@keyframes sweep { 0%, 55% { transform: translateX(-120%); } 100% { transform: translateX(120%); } }
.live .txt { flex: 1; min-width: 0; position: relative; z-index: 1; }
.onair {
  display: inline-flex; align-items: center; gap: 7px;
  background: var(--indigo); color: #fff;
  font-size: 13px; font-weight: 800;
  padding: 5px 11px 4px; border-radius: 999px;
}
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--coral); flex: none; animation: pulse 1.6s ease-out infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(252,94,108,.8); } 70% { box-shadow: 0 0 0 8px rgba(252,94,108,0); } 100% { box-shadow: 0 0 0 0 rgba(252,94,108,0); } }
.bars { display: inline-flex; align-items: flex-end; gap: 2px; height: 11px; }
.bars i { width: 3px; background: var(--cyan); border-radius: 2px; animation: eq 1s ease-in-out infinite; }
.bars i:nth-child(2) { animation-delay: -.3s; }
.bars i:nth-child(3) { animation-delay: -.6s; }
@keyframes eq { 0%, 100% { height: 3px; } 50% { height: 11px; } }
.live h2 { margin: 10px 0 0; font-size: 24px; font-weight: 800; line-height: 1.3; color: #fff; }
.live p { margin: 4px 0 0; font-size: 14.5px; font-weight: 500; color: #fff; }
.go {
  position: relative; z-index: 1;
  width: 58px; height: 58px; flex: none;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--indigo); color: #fff;
  animation: nudge 2.2s ease-in-out infinite;
}
.go svg { width: 26px; height: 26px; }
[dir="rtl"] .go svg { transform: scaleX(-1); }
@keyframes nudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(var(--nudge, -5px)); } }
[dir="ltr"] .go { --nudge: 5px; }

/* Social: each one its own palette color */
.social { display: flex; justify-content: center; gap: 14px; margin-top: -8px; }
.social a {
  width: 52px; height: 52px;
  display: grid; place-items: center;
  border-radius: 50%;
  transition: transform .25s cubic-bezier(.3,1.6,.5,1);
}
.social a { background: var(--indigo); color: #fff; }
.social a:hover { background: var(--cyan); color: var(--indigo); transform: translateY(-4px) rotate(-8deg) scale(1.06); }
.social svg { width: 22px; height: 22px; fill: currentColor; }

/* Section titles: big type with a multicolor underline */
.sec-title { margin: 0 0 14px; font-size: 21px; font-weight: 800; line-height: 1.3; }
.sec-title::after {
  content: ""; display: block; width: 64px; height: 5px; margin-top: 7px; border-radius: 5px;
  background: linear-gradient(90deg, var(--cyan) 0 60%, var(--coral) 60%);
}

/* Soft divider above each section */
.page section { position: relative; padding-top: 28px; }
.page section::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, rgba(48,28,122,0), rgba(48,28,122,.14) 20%, rgba(48,28,122,.14) 80%, rgba(48,28,122,0));
}

/* Free practice tests: two side-by-side features on morphing color blobs, no cards */
.tests { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.test { --tint: var(--cyan); display: flex; flex-direction: column; align-items: center; text-align: center; }
.test.alt { --tint: var(--coral); }
.test-art { position: relative; width: 82%; max-width: 210px; margin: 0 auto 14px; padding: 10px 6px 6px; }
.test-art::before {
  /* morphing color blob behind the picture */
  content: ""; position: absolute; inset: 0 4px 0 4px;
  background: color-mix(in srgb, var(--tint) 26%, white);
  border-radius: 62% 38% 46% 54% / 55% 44% 56% 45%;
  animation: morph 9s ease-in-out infinite;
}
.test.alt .test-art::before { animation-delay: -4.5s; }
@keyframes morph {
  0%, 100% { border-radius: 62% 38% 46% 54% / 55% 44% 56% 45%; transform: rotate(0deg); }
  50% { border-radius: 40% 60% 58% 42% / 42% 58% 42% 58%; transform: rotate(8deg); }
}
.test-art img {
  position: relative; display: block;
  width: 100%; aspect-ratio: 4 / 3; object-fit: cover;
  border-radius: 18px;
  border: 3px solid #fff;
  box-shadow: 0 16px 28px -16px rgba(48,28,122,.6);
  transform: rotate(-3deg);
  transition: transform .35s cubic-bezier(.3,1.4,.5,1);
}
.test.alt .test-art img { transform: rotate(3deg); }
.test:hover .test-art img { transform: rotate(0deg) scale(1.04); }
.test-tag {
  position: absolute; top: 0; inset-inline-end: -2px; z-index: 1;
  font-size: 12px; font-weight: 800; color: #fff;
  background: var(--indigo); padding: 3px 10px 2px;
  border-radius: 999px; border: 2px solid #fff;
  transform: rotate(-8deg);
}
.test-key {
  position: absolute; bottom: -4px; inset-inline-start: -2px; z-index: 1;
  font-size: 12px; font-weight: 900; color: var(--indigo);
  background: #fff; padding: 3px 9px 2px; border-radius: 999px;
  box-shadow: 0 6px 14px -8px rgba(48,28,122,.6);
  animation: bob 3.2s ease-in-out infinite;
}
.test.alt .test-key { animation-delay: -1.6s; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.test h3 { margin: 0; font-size: 18px; font-weight: 800; line-height: 1.35; }
.test p { margin: 4px 0 0; font-size: 13.5px; color: var(--muted); line-height: 1.55; min-height: 2.1em; }
.test-go {
  position: relative;
  display: inline-flex; align-items: center; gap: 6px;
  margin-top: 8px; padding-bottom: 4px;
  font-size: 15px; font-weight: 800; color: var(--indigo);
}
.test-go::after {
  content: ""; position: absolute; bottom: 0; left: 50%;
  width: 36px; height: 3px; margin-left: -18px; border-radius: 3px; background: var(--tint);
  transition: width .3s ease, margin .3s ease;
}
.test:hover .test-go::after { width: 100%; margin-left: -50%; }
.test-go svg { width: 16px; height: 16px; transition: transform .25s ease; }
[dir="rtl"] .test-go svg { transform: scaleX(-1); }
.test:hover .test-go svg { transform: translateX(4px); }
[dir="rtl"] .test:hover .test-go svg { transform: scaleX(-1) translateX(4px); }

/* Countdown inside the live card */
.cd-label { display: block; margin-top: 12px; font-size: 13px; font-weight: 700; color: #fff; }
.cd { display: flex; gap: 6px; margin-top: 6px; }
.cd-u {
  min-width: 52px; padding: 6px 4px 4px;
  text-align: center; border-radius: 14px;
  background: rgba(48,28,122,.9); color: #fff;
}
.cd-u b { display: block; font-size: 21px; font-weight: 900; line-height: 1.15; font-variant-numeric: tabular-nums; }
.cd-u b.tick { animation: tick .45s ease; }
@keyframes tick { from { transform: translateY(-7px); opacity: 0; } to { transform: none; opacity: 1; } }
.cd-u small { display: block; font-size: 11px; font-weight: 500; color: #CFC8F0; }
.cd-now { display: inline-flex; align-items: center; gap: 8px; margin-top: 10px; padding: 7px 14px 6px; border-radius: 999px; background: var(--indigo); color: #fff; font-size: 15px; font-weight: 800; }
@media (max-width: 360px) { .cd-u { min-width: 46px; } .cd-u b { font-size: 18px; } }

/* Exam chips: roomy, scroll a little when the list grows */
.tabs {
  display: flex; gap: 8px;
  overflow-x: auto; scrollbar-width: none;
  margin: 0 -16px 10px; padding: 2px 16px 6px;
  scroll-padding-inline: 16px;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: none;
  font: 700 15.5px/1.2 var(--font);
  color: var(--ink);
  background: #F3F1FA;
  border: 0;
  border-radius: 999px;
  padding: 11px 20px 10px;
  cursor: pointer;
  transition: background .2s ease, color .2s ease, box-shadow .2s ease;
}
.tab:hover { background: #E8E4F6; }
.tab[aria-selected="true"] { background: var(--indigo); color: #fff; box-shadow: 0 8px 18px -10px rgba(48,28,122,.8); }

/* Link rows: open list, thin dividers, no boxes */
.rows { display: flex; flex-direction: column; }
.rows.enter > * { animation: rise .35s ease both; }
.rows.enter > *:nth-child(2) { animation-delay: .05s; }
.rows.enter > *:nth-child(3) { animation-delay: .1s; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.row {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 4px 13px;
  border-bottom: 1.5px dashed #E6E2F2;
  transition: padding .2s ease;
}
.row:last-child { border-bottom: 0; }
.row:hover { padding-inline-start: 10px; }
.icon {
  width: 48px; height: 48px; flex: none;
  display: grid; place-items: center;
  border-radius: 16px 16px 16px 6px;
  color: var(--indigo);
  background: color-mix(in srgb, var(--accent) 28%, white);
  transition: background .2s ease, transform .2s ease;
}
[dir="ltr"] .icon { border-radius: 16px 16px 6px 16px; }
.row:hover .icon { background: var(--indigo); color: #fff; transform: rotate(-6deg); }
.icon svg { width: 23px; height: 23px; }
.row .txt { flex: 1; min-width: 0; }
.row .t { display: block; font-size: 17px; font-weight: 700; line-height: 1.4; }
.row .s { display: block; font-size: 14px; color: var(--muted); margin-top: 2px; }
.pill { display: inline-block; font-size: 12.5px; font-weight: 800; padding: 2px 10px 1px; border-radius: 999px; margin-top: 5px; }
.pill.free { color: #006A7A; background: color-mix(in srgb, var(--cyan) 18%, white); }
.pill.paid { color: #A3172A; background: color-mix(in srgb, var(--coral) 22%, white); }
.arrow {
  width: 34px; height: 34px; flex: none;
  display: grid; place-items: center;
  border-radius: 50%;
  color: var(--indigo);
  border: 2px solid #ECE9F6;
  transition: background .2s ease, border-color .2s ease;
}
.arrow svg { width: 16px; height: 16px; }
[dir="rtl"] .arrow svg { transform: scaleX(-1); }
.row:hover .arrow { background: var(--cyan); border-color: var(--cyan); }

/* Video card: thumbnail with an indigo shade, big title and a pulsing play button */
.video {
  position: relative; display: block;
  aspect-ratio: 4 / 3;
  border-radius: 26px;
  overflow: hidden;
  background: var(--indigo);
  color: #fff;
  box-shadow: 0 20px 40px -20px rgba(48,28,122,.7);
  isolation: isolate;
}
.video img {
  position: absolute; inset: 0; z-index: -2;
  width: 100%; height: 100%; object-fit: cover;
  transform: scale(1.08);
  filter: blur(1.5px) saturate(1.1);
  transition: transform .6s ease;
}
.video:hover img { transform: scale(1.12); }
.video::before {
  content: ""; position: absolute; inset: 0; z-index: -1;
  background:
    linear-gradient(0deg, rgba(48,28,122,.98) 0%, rgba(48,28,122,.9) 45%, rgba(48,28,122,.55) 100%);
}
.vplay {
  position: absolute; top: 32%; left: 50%;
  width: 74px; height: 74px; margin: -37px 0 0 -37px;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--coral);
  box-shadow: 0 0 0 0 rgba(252,94,108,.7);
  animation: ring 2s ease-out infinite;
  transition: transform .25s cubic-bezier(.3,1.6,.5,1);
}
.video:hover .vplay { transform: scale(1.12); }
.vplay svg { width: 30px; height: 30px; margin-left: 4px; fill: #fff; }
@keyframes ring { 0% { box-shadow: 0 0 0 0 rgba(252,94,108,.7); } 70% { box-shadow: 0 0 0 18px rgba(252,94,108,0); } 100% { box-shadow: 0 0 0 0 rgba(252,94,108,0); } }
.vtxt { position: absolute; inset-inline: 18px; bottom: 16px; }
.vtag {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px; font-weight: 800;
  color: var(--indigo); background: var(--cyan);
  padding: 4px 11px 3px; border-radius: 999px;
}
.vtag svg { width: 16px; height: 16px; }
.vtxt h3 { margin: 10px 0 0; font-size: 25px; font-weight: 900; line-height: 1.25; text-wrap: balance; }
.vtxt .big { color: var(--cyan); }
.vrow { margin-top: 6px; }

/* More section accents */
#join { --accent: var(--coral); }
details > summary { list-style: none; cursor: pointer; }
details > summary::-webkit-details-marker { display: none; }
details .caret { transition: transform .25s ease; }
details[open] .caret { transform: rotate(180deg); }
details[open] > summary { border-bottom-style: solid; }
details .inner { padding-inline-start: 62px; }
details .inner .row .t { font-size: 16.5px; font-weight: 700; }
details[open] .inner > * { animation: rise .3s ease both; }

footer { text-align: center; font-size: 14px; color: var(--muted); padding: 6px 0 4px; }
footer a { color: var(--indigo); font-weight: 800; }

/* Tablets and laptops: one wider, centered column */
@media (min-width: 760px) {
  body {
    background:
      radial-gradient(38% 45% at 0% 55%, rgba(0,195,224,.07) 0%, rgba(0,195,224,0) 70%),
      radial-gradient(38% 45% at 100% 85%, rgba(252,94,108,.06) 0%, rgba(252,94,108,0) 70%),
      var(--white);
    background-attachment: fixed;
  }
  .hero { padding: 22px 32px 96px; }
  .topbar { max-width: 1100px; }
  .logo { height: 34px; }
  .hero-in, .page { max-width: 640px; }
  .hero-in { padding-top: 40px; text-align: center; }
  .hero h1 { font-size: 40px; }
  .accred { justify-content: center; }
  .cta { max-width: 460px; margin-inline: auto; }
  .live { margin-top: -64px; }
  .video { aspect-ratio: 16 / 9; }
  .tabs { margin-inline: 0; padding-inline: 0; flex-wrap: wrap; }
}
@media (max-width: 360px) {
  .hero h1 { font-size: 27px; }
  .cta-main { font-size: 15px; padding: 0 10px; }
  .cta-alt { padding-inline: 4px 10px; font-size: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<header class="hero">

const ICONS = {
  badge: '<path d="M12 3l2.1 1.5 2.6-.1.8 2.5 2.1 1.5-.8 2.5.8 2.5-2.1 1.5-.8 2.5-2.6-.1L12 21l-2.1-1.5-2.6.1-.8-2.5-2.1-1.5.8-2.5-.8-2.5 2.1-1.5.8-2.5 2.6.1z"/><path d="m9 12 2 2 4-4"/>',
  course: '<path d="M2.5 9 12 4.5 21.5 9 12 13.5z"/><path d="M6.5 11v4.5c0 1.6 2.5 3 5.5 3s5.5-1.4 5.5-3V11"/>',
  pack: '<path d="M6.5 3.5h7l4.5 4.5v12.5h-11.5z"/><path d="M13.5 3.5V8H18"/><path d="M9.5 13h5M9.5 16.5h5"/>',
  practice: '<rect x="5" y="4" width="14" height="17" rx="3"/><path d="m9 12.5 2 2 4-4.5"/>',
  community: '<path d="M4.5 5.5h15v10.5h-9l-4.5 3.5V16h-1.5z"/><path d="M8.5 10.5h7"/>',
  chat: '<path d="M4.5 5.5h15v10.5h-9l-4.5 3.5V16h-1.5z"/><path d="M8.5 10.5h7"/>',
  video: '<circle cx="12" cy="12" r="8.5"/><path d="M10.2 8.8v6.4l5.3-3.2z"/>',
  people: '<circle cx="9" cy="8.5" r="3"/><path d="M3.5 19c.6-3 2.8-4.8 5.5-4.8s4.9 1.8 5.5 4.8"/><circle cx="17" cy="9.5" r="2.4"/><path d="M15.8 14.4c2.3.2 4 1.8 4.5 4.3"/>',
  arrow: '<path d="m9 6 6 6-6 6"/>',
  spark: '<path d="M12 3.5l2.2 5.3 5.3 2.2-5.3 2.2L12 18.5l-2.2-5.3L4.5 11l5.3-2.2z"/><path d="M18.5 16.5l.8 1.9 1.9.8-1.9.8-.8 1.9-.8-1.9-1.9-.8 1.9-.8z"/>',
  caret: '<path d="m6 9 6 6 6-6"/>'
};
const svg = (name, cls) => `<svg class="${cls || ""}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;
const ARROW = `<span class="arrow">${svg("arrow")}</span>`;
const CARET = `<span class="arrow caret">${svg("caret")}</span>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ext = 'target="_blank" rel="noopener"';
const $ = id => document.getElementById(id);
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const state = { lang: "ar", exam: "gat" };

function linkRow(url, title, sub, iconName, pillHtml) {
  return `<a class="row" href="${esc(url)}" ${ext}>
    ${iconName ? `<span class="icon">${svg(iconName)}</span>` : ""}
    <span class="txt"><span class="t">${esc(title)}</span>${sub ? `<span class="s" dir="auto">${esc(sub)}</span>` : ""}${pillHtml || ""}</span>
    ${ARROW}</a>`;
}

/* Countdown to the live session; switches to a "live now" note once it starts */
const pad = n => String(n).padStart(2, "0");
function renderCountdown() {
  const box = $("cdBox");
  if (!box) return;
  const L = state.lang, C = CONTENT.live;
  const left = new Date(C.start).getTime() - Date.now();
  if (left <= 0) {
    if (!box.dataset.live) { box.dataset.live = "1"; box.innerHTML = `<span class="cd-now"><span class="dot" aria-hidden="true"></span>${esc(C.now[L])}</span>`; }
    return;
  }
  const s = Math.floor(left / 1000);
  const vals = [Math.floor(s / 86400), Math.floor(s % 86400 / 3600), Math.floor(s % 3600 / 60), s % 60].map(pad);
  if (!box.firstChild) {
    box.innerHTML = `<span class="cd-label">${esc(C.soon[L])}</span><span class="cd" role="timer" aria-live="off">` +
      C.units[L].map((u, k) => `<span class="cd-u"><b>${vals[k]}</b><small>${esc(u)}</small></span>`).join("") + `</span>`;
    return;
  }
  box.querySelectorAll(".cd-u b").forEach((b, k) => {
    if (b.textContent === vals[k]) return;
    b.textContent = vals[k];
    if (!reduceMotion) { b.classList.remove("tick"); void b.offsetWidth; b.classList.add("tick"); }
  });
}
setInterval(renderCountdown, 1000);

function renderPanel() {
  const L = state.lang, C = CONTENT;
  const exam = C.exams.items.find(e => e.id === state.exam) || C.exams.items[0];
  document.querySelectorAll(".tab").forEach(t => {
    const on = t.dataset.id === exam.id;
    t.setAttribute("aria-selected", on ? "true" : "false");
    t.tabIndex = on ? 0 : -1;
  });
  const panel = $("examPanel");
  panel.setAttribute("aria-labelledby", "tab-" + exam.id);
  panel.innerHTML = exam.links.map(k => {
    const ty = C.types[k.type];
    return linkRow(k.url, k[L], "", k.type, `<span class="pill ${ty.pill}">${esc(ty[L])}</span>`);
  }).join("");
  panel.classList.remove("enter");
  void panel.offsetWidth;
  panel.classList.add("enter");
}

function render() {
  const L = state.lang, C = CONTENT;
  const root = document.documentElement;
  root.lang = L;
  root.dir = L === "ar" ? "rtl" : "ltr";
  document.title = C.meta.title[L];

  const btn = $("langBtn");
  btn.textContent = C.meta.langBtn[L];
  btn.lang = L === "ar" ? "en" : "ar";
  btn.setAttribute("aria-label", L === "ar" ? "Switch to English" : "التحويل إلى العربية");

  const [t1, t2] = C.meta.tagline[L];
  $("tagline").innerHTML = `${esc(t1)} <span class="glow">${esc(t2)}</span>`;
  $("accred").innerHTML = `${svg("badge")}<span>${esc(C.accred[L])}</span>`;
  const [enroll, wa] = C.cta;
  $("cta").innerHTML = `<a class="cta-main" href="${esc(enroll.url)}" ${ext}><span>${esc(enroll[L])}</span>${svg("arrow")}</a>
    <a class="cta-alt" href="${esc(wa.url)}" ${ext}><span class="wa">${svg("chat")}</span><span>${esc(wa[L])}</span></a>`;

  const live = $("live");
  live.href = C.live.url;
  live.setAttribute("aria-label", `${C.live.title[L]} – ${C.live.go[L]}`);
  live.innerHTML = `<span class="txt">
      <span class="onair"><span class="dot" aria-hidden="true"></span>${esc(C.live.kicker[L])}<span class="bars" aria-hidden="true"><i></i><i></i><i></i></span></span>
      <h2>${esc(C.live.title[L])}</h2>
      <p>${esc(C.live.sub[L])}</p>
      <span id="cdBox"></span>
    </span>
    <span class="go">${svg("arrow")}</span>`;
  renderCountdown();

  $("social").innerHTML = C.social.map(s => `<a href="${esc(s.url)}" ${ext} aria-label="${esc(s[L])}" title="${esc(s[L])}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${SOCIAL_ICONS[s.icon]}"/></svg></a>`).join("");

  $("testsTitle").textContent = C.tests.title[L];
  $("tests").innerHTML = C.tests.items.map(i => `<a class="test${i.alt ? " alt" : ""}" href="${esc(i.url)}" ${ext}>
      <span class="test-art"><img src="${i.img}" alt="${esc(i.title[L])}" loading="lazy"><span class="test-tag">${esc(C.tests.tag[L])}</span><span class="test-key" dir="ltr">${esc(i.key)}</span></span>
      <h3>${esc(i.title[L])}</h3><p>${esc(i.sub[L])}</p>
      <span class="test-go">${esc(C.tests.go[L])}${svg("arrow")}</span></a>`).join("");

  $("examTitle").textContent = C.exams.title[L];
  $("tabs").innerHTML = C.exams.items.map(e =>
    `<button class="tab" type="button" role="tab" id="tab-${e.id}" data-id="${e.id}" aria-controls="examPanel">${esc(e.tab[L])}</button>`).join("");
  renderPanel();

  $("videoTitle").textContent = C.video.title[L];
  const V = C.video, [h1, h2, h3] = V.head[L];
  const vid = $("video");
  vid.href = V.url;
  vid.setAttribute("aria-label", `${h1} ${h2} ${h3}`);
  vid.innerHTML = `<img src="${esc(V.thumb)}" alt="" loading="lazy">
    <span class="vplay" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5z"/></svg></span>
    <span class="vtxt"><span class="vtag">${svg("video")}${esc(V.tag[L])}</span>
      <h3>${esc(h1)} <span class="big" dir="ltr">${esc(h2)}</span> ${esc(h3)}</h3></span>`;

  $("moreTitle").textContent = C.more[L];
  $("yt").innerHTML = linkRow(C.youtube.url, C.youtube[L][0], C.youtube[L][1], "video");

  const join = $("join");
  const wasOpen = join.open;
  join.innerHTML = `<summary class="row">
      <span class="icon">${svg("people")}</span>
      <span class="txt"><span class="t">${esc(C.join.title[L])}</span><span class="s">${esc(C.join.sub[L])}</span></span>
      ${CARET}</summary>
    <div class="inner">${C.join.items.map(i => linkRow(i.url, i[L], "", null)).join("")}</div>`;
  join.open = wasOpen;

  $("footer").innerHTML = `${esc(C.footer[L])} · <a href="https://leen.sa/" ${ext}>leen.sa</a> · <a href="mailto:sales@leen.sa">sales@leen.sa</a>`;
}

/* Start state: #en opens English, #saat (or another exam id) opens that exam */
try {
  const h = location.hash.replace("#", "");
  const saved = localStorage.getItem("leen-lang");
  if (saved === "en" || saved === "ar") state.lang = saved;
  if (h === "en" || h === "ar") state.lang = h;
  if (CONTENT.exams.items.some(e => e.id === h)) state.exam = h;
} catch (e) {}
render();

$("langBtn").addEventListener("click", () => {
  state.lang = state.lang === "ar" ? "en" : "ar";
  render();
  try { localStorage.setItem("leen-lang", state.lang); } catch (e) {}
});

$("tabs").addEventListener("click", ev => {
  const t = ev.target.closest(".tab");
  if (!t) return;
  state.exam = t.dataset.id;
  renderPanel();
  t.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "nearest", inline: "nearest" });
});

$("tabs").addEventListener("keydown", ev => {
  const keys = ["ArrowLeft", "ArrowRight", "Home", "End"];
  if (!keys.includes(ev.key)) return;
  const tabs = [...document.querySelectorAll(".tab")];
  let i = tabs.findIndex(t => t.dataset.id === state.exam);
  const rtl = document.documentElement.dir === "rtl";
  if (ev.key === "Home") i = 0;
  else if (ev.key === "End") i = tabs.length - 1;
  else {
    const forward = (ev.key === "ArrowRight") !== rtl;
    i = (i + (forward ? 1 : -1) + tabs.length) % tabs.length;
  }
  state.exam = tabs[i].dataset.id;
  renderPanel();
  tabs[i].focus();
  ev.preventDefault();
});
</script>
